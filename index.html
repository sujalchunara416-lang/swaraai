  <style>


:root {
  --bg: #090714;
  --panel: #100d20;
  --card: #18132b;
  --purple: #9b70ff;
  --cyan: #54e4ff;
  --text: #f7f3ff;
  --muted: #9690aa;
  --border: rgba(255,255,255,.09);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
  color: var(--text);
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 12px;
  padding: 11px 15px;
  transition: .2s;
}

button:hover {
  border-color: var(--purple);
  transform: translateY(-1px);
}

input, textarea, select {
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px;
  outline: none;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--purple);
}

.hidden {
  display: none !important;
}

/* LOADER */

#loader {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  background: var(--bg);
  animation: fadeOut 1s ease 2s forwards;
}

.loader-logo {
  width: 75px;
  height: 75px;
  display: grid;
  place-items: center;
  font-size: 40px;
  border-radius: 24px;
  color: white;
  background: linear-gradient(135deg,#7445ed,#20c8e8);
  box-shadow: 0 0 50px #8054ff88;
}

#loader p {
  color: var(--muted);
}

@keyframes fadeOut {
  to {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
}

/* AUTH */

#authScreen {
  height: 100dvh;
  display: grid;
  place-items: center;
  padding: 20px;
}

.auth-card {
  width: 100%;
  max-width: 400px;
  padding: 30px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  border: 1px solid var(--border);
  border-radius: 25px;
  background: var(--panel);
  box-shadow: 0 0 60px #7040ff22;
}

.auth-card h1 {
  font-size: 27px;
}

.auth-card p {
  color: var(--muted);
}

/* MAIN APP */

#app {
  display: flex;
  width: 100%;
  height: 100dvh;
}

/* SIDEBAR */

#sidebar {
  width: 265px;
  flex-shrink: 0;
  padding: 22px 16px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.brand {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.brand span {
  color: var(--cyan);
}

#newChatBtn {
  background: linear-gradient(120deg,#7445ed,#456ce8);
  border: none;
}

#sidebar h4 {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
}

#personality {
  width: 100%;
}

#chatHistory {
  display: flex;
  flex-direction: column;
  gap: 7px;
  overflow-y: auto;
  flex: 1;
}

#chatHistory button {
  text-align: left;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.sidebar-bottom {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* CHAT */

#chatArea {
  flex: 1;
  min-width: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at 50% 30%,#31205b33,transparent 60%),
    var(--bg);
}

#topbar {
  height: 65px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

#topbar h3 {
  font-size: 17px;
}

#topbar h3 span {
  color: var(--purple);
}

#menuBtn {
  display: none;
}

/* WELCOME */

#welcomeScreen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 17px;
  padding: 20px;
}

.ai-avatar {
  width: 85px;
  height: 85px;
  border-radius: 28px;
  display: grid;
  place-items: center;
  font-size: 45px;
  background: linear-gradient(135deg,#7445ed,#20c8e8);
  box-shadow: 0 0 60px #7445ed66;
  animation: float 3s infinite ease-in-out;
}

@keyframes float {
  50% { transform: translateY(-9px); }
}

#welcomeScreen h1 {

}

#welcomeScreen p {
  color: var(--muted);
}

.suggestions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
}

/* MESSAGES */

#messages {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 25px max(5%,20px);
  flex-direction: column;
  gap: 20px;
}

.message {
  max-width: 85%;
  padding: 14px 17px;
  border: 1px solid var(--border);
  border-radius: 17px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user {
  align-self: flex-end;
  background: linear-gradient(135deg,#6540c9,#394d9c);
}

.message.ai {
  align-self: flex-start;
  background: var(--panel);
}

.message img {
  max-width: 100%;
  border-radius: 12px;
}

/* INPUT */

#chatFooter {
  padding: 15px max(4%,20px) 12px;
}

.input-box {
  max-width: 850px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 0 35px #0005;
}

#userInput {
  flex: 1;
  min-width: 0;
  max-height: 130px;
  resize: none;
  border: none;
  background: transparent;
}

#sendBtn {
  background: linear-gradient(135deg,#8052f5,#20bfe0);
  border: none;
}

#chatFooter > p {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  margin-top: 9px;
}

#attachmentPreview {
  padding: 0 20px;
}

/* SETTINGS */

#settingsPanel {
  position: absolute;
  z-index: 20;
  inset: 75px 15px 90px auto;
  width: min(340px,90%);
  padding: 23px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: 0 10px 60px #0009;
  overflow-y: auto;
}

#settingsPanel h2 {
  margin-bottom: 20px;
}

#settingsPanel label {
  display: block;
  margin: 15px 0 8px;
  color: var(--muted);
}

#settingsPanel select {
  width: 100%;
}

/* LIGHT THEME */

body.light {
  --bg: #f4f1ff;
  --panel: #ffffff;
  --card: #eeeafa;
  --text: #201833;
  --muted: #716a80;
  --border: rgba(30,20,60,.12);
}

/* MOBILE */

@media(max-width:700px) {
  #sidebar {
    position: fixed;
    z-index: 50;
    inset: 0 auto 0 0;
    width: 270px;
    transform: translateX(-105%);
    transition: transform .25s;
  }

  #sidebar.open {

  }

  #menuBtn {
    display: block;
  }

  }

  .message {
    max-width: 94%;
  }

  #chatFooter {
    padding: 10px;
  }

  .input-box {
    border-radius: 16px;
    gap: 5px;
  }

  .input-box button {
    padding: 10px;
  }

  #welcomeScreen h1 {
    font-size: 27px;
  }
}

  <script>
   
// =====================================
// SWARA AI 3.0 - PART 3
// CORE APPLICATION ENGINE
// =====================================

const $ = (id) => document.getElementById(id);

const state = {
  user: null,
  chats: [],
  activeChat: null,
  personality: "adaptive",
  attachments: [],
  memory: true,
  voice: false,
  adult: false
};

// =====================================
// LOCAL STORAGE
// =====================================

function saveData() {
  if (!state.user) return;

  localStorage.setItem(
    "swara_user_" + state.user.email,
    JSON.stringify({
      chats: state.chats,
      activeChat: state.activeChat,
      personality: state.personality,
      memory: state.memory,
      voice: state.voice,
      adult: state.adult
    })
  );
}

function loadData() {
  const saved = localStorage.getItem(
    "swara_user_" + state.user.email
  );

  if (saved) {
    try {
      const data = JSON.parse(saved);

      state.chats = data.chats || [];
      state.activeChat = data.activeChat || null;
      state.personality = data.personality || "adaptive";
      state.memory = data.memory ?? true;
      state.voice = data.voice ?? false;
      state.adult = data.adult ?? false;
    } catch (error) {
      console.error("Memory loading error:", error);
    }
  }

  if (!state.chats.length) {
    createNewChat();
  }

  $("personality").value = state.personality;
  $("memoryToggle").checked = state.memory;
  $("voiceToggle").checked = state.voice;
  $("adultToggle").checked = state.adult;

  renderHistory();
  renderMessages();
}

// =====================================
// AUTH SCREEN - TEMPORARY LOCAL DEMO
// =====================================

function showAuth() {
  $("loader").classList.add("hidden");
  $("app").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
}

function showApp() {
  $("loader").classList.add("hidden");
  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
}

function login() {
  const email = $("authEmail").value.trim().toLowerCase();
  const password = $("authPassword").value;

  if (!email || !password) {
    $("authMessage").textContent =
      "Enter your email and password.";
    return;
  }

  // DEMO ONLY: real secure authentication
  // will be connected in Part 8.

  const users = JSON.parse(
    localStorage.getItem("swara_demo_users") || "{}"
  );

  if (!users[email] || users[email].password !== password) {
    $("authMessage").textContent =
      "Account not found. Please sign up first.";
    return;
  }

  state.user = {
    email,
    name: users[email].name
  };

  localStorage.setItem("swara_current_user", email);

  loadData();
  showApp();
}

function signup() {
  const name = $("authName").value.trim();
  const email = $("authEmail").value.trim().toLowerCase();
  const password = $("authPassword").value;

  if (!name || !email || password.length < 6) {
    $("authMessage").textContent =
      "Enter name, valid email and password (6+ characters).";
    return;
  }

  const users = JSON.parse(
    localStorage.getItem("swara_demo_users") || "{}"
  );

  if (users[email]) {
    $("authMessage").textContent =
      "Account already exists. Login instead.";
    return;
  }

  users[email] = { name, password };

  localStorage.setItem(
    "swara_demo_users",
    JSON.stringify(users)
  );

  state.user = { name, email };

  localStorage.setItem("swara_current_user", email);

  loadData();
  showApp();
}

function logout() {
  saveData();
  state.user = null;
  localStorage.removeItem("swara_current_user");
  showAuth();
}

// =====================================
// CHAT CREATION
// =====================================

function createNewChat() {
  const chat = {
    id: Date.now().toString(),
    title: "New Conversation",
    messages: [],
    created: new Date().toISOString()
  };

  state.chats.unshift(chat);
  state.activeChat = chat.id;

  saveData();
  renderHistory();
  renderMessages();
}

function getActiveChat() {
  return state.chats.find(
    chat => chat.id === state.activeChat
  );
}

function switchChat(id) {
  state.activeChat = id;
  saveData();
  renderHistory();
  renderMessages();
}

function deleteChat(id) {
  state.chats = state.chats.filter(
    chat => chat.id !== id
  );

  if (state.activeChat === id) {
    state.activeChat = state.chats[0]?.id || null;
  }

  if (!state.activeChat) {
    createNewChat();
  }

  saveData();
  renderHistory();
  renderMessages();
}

// =====================================
// CHAT HISTORY
// =====================================

function renderHistory() {
  const container = $("chatHistory");
  container.innerHTML = "";

  state.chats.forEach(chat => {
    const row = document.createElement("div");
    row.style.display = "flex";
    row.style.gap = "5px";

    const open = document.createElement("button");
    open.textContent = chat.title;
    open.style.flex = "1";

    if (chat.id === state.activeChat) {
      open.style.borderColor = "var(--purple)";
    }

    open.onclick = () => switchChat(chat.id);

    const del = document.createElement("button");
    del.textContent = "×";
    del.title = "Delete conversation";
    del.onclick = () => {
      if (confirm("Delete this conversation?")) {
        deleteChat(chat.id);
      }
    };

    row.append(open, del);
    container.appendChild(row);
  });
}

// =====================================
// MESSAGE DISPLAY
// =====================================

function addMessage(role, content) {
  const chat = getActiveChat();
  if (!chat) return;

  chat.messages.push({
    role,
    content,
    time: new Date().toISOString()
  });

  if (chat.messages.length === 1) {
    chat.title = content.slice(0, 30);
  }

  saveData();
  renderMessages();
  renderHistory();
}

function renderMessages() {
  const chat = getActiveChat();
  const welcome = $("welcomeScreen");
  const messages = $("messages");

  messages.innerHTML = "";

  if (!chat || !chat.messages.length) {
    welcome.style.display = "flex";
    messages.style.display = "none";
    return;
  }

  welcome.style.display = "none";
  messages.style.display = "flex";

  chat.messages.forEach(msg => {
    const div = document.createElement("div");

    div.className =
      "message " + (msg.role === "user" ? "user" : "ai");

    div.textContent = msg.content;

    messages.appendChild(div);
  });

  messages.scrollTop = messages.scrollHeight;
}

// =====================================
// PERSONALITY SYSTEM
// =====================================

const personalities = {
  adaptive: "Adapt your tone naturally to the user's mood and conversation.",
  romantic: "Be warm, affectionate, romantic and caring.",
  flirty: "Use playful flirting, cute teasing and charming compliments.",
  bold: "Be confident, direct, playful and mature in adult conversations.",
  funny: "Be humorous, witty and entertaining.",
  savage: "Use clever, playful and witty comebacks without cruelty.",
  caring: "Be empathetic, patient and supportive.",
  professional: "Be precise, intelligent, formal and solution-focused."
};

$("personality").addEventListener("change", e => {
  state.personality = e.target.value;
  saveData();
});

// =====================================
// THEME
// =====================================

$("themeBtn").onclick = () => {
  document.body.classList.toggle("light");

  localStorage.setItem(
    "swara_theme",
    document.body.classList.contains("light")
      ? "light" : "dark"
  );
};

if (localStorage.getItem("swara_theme") === "light") {
  document.body.classList.add("light");
}

// =====================================
// SETTINGS
// =====================================

$("settingsBtn").onclick = () => {
  $("settingsPanel").classList.toggle("hidden");
};

$("closeSettingsBtn").onclick = () => {
  $("settingsPanel").classList.add("hidden");
};

$("memoryToggle").onchange = e => {
  state.memory = e.target.checked;
  saveData();
};

$("voiceToggle").onchange = e => {
  state.voice = e.target.checked;
  saveData();
};

$("adultToggle").onchange = e => {
  state.adult = e.target.checked;
  saveData();
};

// =====================================
// NEW CHAT + SIDEBAR
// =====================================

$("newChatBtn").onclick = () => {
  createNewChat();
  $("sidebar").classList.remove("open");
};

$("menuBtn").onclick = () => {
  $("sidebar").classList.toggle("open");
};

// =====================================
// PROFILE
// =====================================

$("profileBtn").onclick = () => {
  alert(
    "SWARA PROFILE\n\nName: " + state.user.name +
    "\nEmail: " + state.user.email
  );
};

// =====================================
// CLEAR AND EXPORT
// =====================================

$("clearChatsBtn").onclick = () => {
  if (!confirm("Delete all your chats?")) return;

  state.chats = [];
  createNewChat();
};

$("exportBtn").onclick = () => {
  const blob = new Blob(
    [JSON.stringify(state.chats, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "swara-chats.json";
  a.click();

  URL.revokeObjectURL(url);
};

// =====================================
// AUTH BUTTON CONNECTIONS
// =====================================

$("loginBtn").onclick = login;
$("signupBtn").onclick = signup;
$("logoutBtn").onclick = logout;

// =====================================
// START APPLICATION
// =====================================

const currentUser = localStorage.getItem(
  "swara_current_user"
);

const demoUsers = JSON.parse(
  localStorage.getItem("swara_demo_users") || "{}"
);

if (currentUser && demoUsers[currentUser]) {
  state.user = {
    email: currentUser,
    name: demoUsers[currentUser].name
  };

  loadData();
  showApp();
} else {
  showAuth();
}

console.log("SWARA AI 3.0 - Part 3 Loaded");

// =====================================
// SWARA AI 3.0 - PART 4
// AI CHAT ENGINE
// =====================================

// Temporary testing key.
// Public launch: move this to secure backend.
const GROQ_API_KEY = "PASTE_YOUR_GROQ_API_KEY_HERE";

const GROQ_MODEL = "llama-3.3-70b-versatile";

let isThinking = false;

// =====================================
// PERSONALITY PROMPTS
// =====================================

function getPersonalityPrompt() {
  const mode = state.personality;

  const prompts = {
    adaptive: `
      Adapt your tone to the user's mood.
      Be intelligent, warm, friendly and natural.
      Use humor or affection when appropriate.
    `,

    romantic: `
      You are SWARA, a warm fictional AI companion.
      Be affectionate, caring, sweet and romantic.
      Use cute compliments and playful teasing.
      Never claim to be a real human.

    );

    if (!response.ok) {
      const error = await response.json();

      throw new Error(
        error.error?.message || "AI service unavailable"
      );
    }

    const data = await response.json();

    const aiReply =
      data.choices?.[0]?.message?.content;

    if (!aiReply) {

    addMessage("ai", aiReply);

      "ai",

// Load external libraries when needed
function loadSwaraLibrary(url) {
  return new Promise((resolve, reject) => {
    const existing = [...document.scripts].find(s => s.src === url);
    if (existing) {
      if (existing.dataset.loaded === "yes") return resolve();
      existing.addEventListener("load", resolve, { once: true });
      existing.addEventListener("error", reject, { once: true });
      return;
    }

    const script = document.createElement("script");
    script.src = url;
    script.onload = () => {
      script.dataset.loaded = "yes";
      resolve();
    };
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

// Convert file to Base64
function swaraFileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      resolve(result.split(",")[1]);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Read TXT and CSV
async function swaraReadText(file) {

// Read PDF
async function swaraReadPDF(file) {
  await loadSwaraLibrary(
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
  );

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const data = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data }).promise;

  let fullText = "";

  for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
    const page = await pdf.getPage(pageNo);
    const content = await page.getTextContent();

    const pageText = content.items
      .map(item => item.str)
      .join(" ");

    fullText += `\n\nPAGE ${pageNo}\n${pageText}`;
  }

  return fullText;
}

// Read DOCX
async function swaraReadDOCX(file) {
  await loadSwaraLibrary(
    "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"
  );

  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer });

  return result.value;
}

      results.push(

}

// Wikipedia-based web search
async function swaraWebSearch(query) {
  const url =
    "https://en.wikipedia.org/w/api.php?" +
    new URLSearchParams({
      action: "query",
      list: "search",
      srsearch: query,
      format: "json",
      origin: "*",
      srlimit: "5"
    });

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Search service unavailable.");
  }

  const data = await response.json();
  const results = data.query?.search || [];

  if (!results.length) {
    return "No matching Wikipedia results found.";
  }

  return results.map((item, index) => {
    const title = item.title;
    const snippet = item.snippet
      .replace(/<[^>]*>/g, "")
      .replace(/&quot;/g, '"')
      .replace(/&#039;/g, "'");

    const link =
      "https://en.wikipedia.org/wiki/" +
      encodeURIComponent(title.replace(/ /g, "_"));

    return `${index + 1}. ${title}\n${snippet}\n${link}`;
  }).join("\n\n");
}

function swaraBackup() {
  const backup = {
    app: "SWARA AI",
    version: "3.0 Personal",
    date: new Date().toISOString(),
    data: {}
  };

  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);

    if (key && key.startsWith("swara_")) {
      backup.data[key] = localStorage.getItem(key);
    }
  }

  const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "SWARA-Personal-Backup.json";
  a.click();

  URL.revokeObjectURL(url);
}

// 3. RESTORE BACKUP
function swaraRestoreBackup(file) {
  const reader = new FileReader();

  reader.onload = function () {
    try {
      const backup = JSON.parse(reader.result);

      if (
        backup.app !== "SWARA AI" ||
        !backup.data ||
        typeof backup.data !== "object"
      ) {
        throw new Error("Invalid SWARA backup.");
      }

      if (!confirm("Restore this SWARA backup?")) return;

      Object.entries(backup.data).forEach(([key, value]) => {
        if (
          key.startsWith("swara_") &&
          typeof value === "string"
        ) {
          localStorage.setItem(key, value);
        }
      });

      alert("Backup restored. Reloading SWARA...");
      location.reload();

    } catch (error) {
      alert("Backup error: " + error.message);
    }
  };

  reader.readAsText(file);
}

  if (!confirm("Clear all saved SWARA memories?")) return;

  if (typeof forgetSwaraMemory === "function") {
    forgetSwaraMemory();
  }

  alert("Saved memory cleared.");
}

// 5. CHECK GROQ API CONFIGURATION
function swaraCheckAPI() {
  if (
    typeof GROQ_API_KEY === "undefined" ||
    !GROQ_API_KEY ||
    GROQ_API_KEY.includes("PASTE")
  ) {
    alert(
      "Groq API key is missing. Add your key in Part 4."
    );
    return false;
  }

  alert("API key is configured. Testing connection...");

  return true;
}

// 6. TEST AI CONNECTION
async function swaraTestConnection() {
  if (!swaraCheckAPI()) return;

  try {
    const model =
      typeof GROQ_MODEL !== "undefined"
        ? GROQ_MODEL
        : "llama-3.3-70b-versatile";

    const response = await fetch(
      "https://api.groq.com/openai/v1/chat/completions",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + GROQ_API_KEY
        },
        body: JSON.stringify({
          model,
          messages: [
            {
              role: "user",
              content: "Reply only: SWARA connected!"
            }
          ],
          max_tokens: 30
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error?.message || "Connection failed"
      );
    }

    alert(
      "SWARA AI connected successfully!\n\n" +
      result.choices[0].message.content
    );

  } catch (error) {
    alert("Connection error: " + error.message);
  }
}
