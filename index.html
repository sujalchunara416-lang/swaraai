<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWARA AI - Professional Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; box-shadow: 0 0 12px rgba(59,130,246,0.4); }
        h1 { font-size: 18px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.5px; }
        
        .header-controls { display: flex; gap: 8px; align-items: center; }
        button, select, input { background: #0f172a; border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 12px; border-radius: 6px; font-size: 13px; outline: none; transition: all 0.2s; }
        button { background: var(--accent-color); border: none; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--accent-hover); }
        select { cursor: pointer; }

        /* Settings Panel */
        .settings-panel { background: #162032; padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; transition: max-height 0.3s ease; overflow: hidden; }
        .settings-panel.hidden { display: none; }
        .settings-panel input { flex: 1; min-width: 220px; padding: 8px 12px; }

        /* Status Bar */
        .status-bar { font-size: 11px; color: var(--text-secondary); text-align: center; padding: 4px; background: #0b1120; border-bottom: 1px solid #1e293b; }

        /* Chat Container */
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        
        .message-wrapper { display: flex; gap: 12px; max-width: 85%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .message-wrapper.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-wrapper.bot { align-self: flex-start; }

        .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .user .avatar { background: var(--accent-color); color: white; }
        .bot .avatar { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; box-shadow: 0 0 10px rgba(139,92,246,0.3); }

        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .user .bubble { background: var(--accent-color); color: white; border-bottom-right-radius: 2px; }
        .bot .bubble { background: var(--panel-bg); color: var(--text-primary); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }

        /* Input Area */
        .input-container { padding: 15px 20px; background: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; }
        .input-box-wrapper { flex: 1; display: flex; background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 12px; gap: 10px; align-items: center; }
        .input-box-wrapper:focus-within { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(59,130,246,0.2); }
        .input-box-wrapper input { flex: 1; border: none; background: transparent; padding: 0; font-size: 14px; color: var(--text-primary); }
        
        .send-btn { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--accent-color); color: white; border: none; cursor: pointer; font-size: 16px; transition: transform 0.1s; }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">S</div>
            <h1>SWARA AI</h1>
        </div>
        <div class="header-controls">
            <select id="model">
                <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
            </select>
            <button id="toggle-settings" title="Settings">⚙️</button>
            <button id="clear" title="Clear Chat">🗑️</button>
            <button id="voice" title="Voice Toggle">🔊</button>
        </div>
    </header>

    <div class="settings-panel hidden" id="settings-box">
        <input type="password" id="key" placeholder="Enter Gemini API Key...">
        <button id="save">Save Key</button>
    </div>

    <div class="status-bar" id="status">SWARA is ready</div>

    <div id="chat"></div>

    <div class="input-container">
        <div class="input-box-wrapper">
            <input type="text" id="message" placeholder="Ask SWARA anything...">
            <button class="send-btn" id="send">➤</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const $ = id => document.getElementById(id);
            const KEY = "swara_key_v1";
            const MODEL = "swara_model_v1";
            const HISTORY = "swara_history_v1";
            let voiceOn = true;
            let history = [];

            try {
                history = JSON.parse(localStorage.getItem(HISTORY)) || [];
            } catch(e) { history = []; }

            if($("key")) $("key").value = localStorage.getItem(KEY) || "";
            if($("model")) $("model").value = localStorage.getItem(MODEL) || "gemini-3.8-flash";

            // Toggle settings panel
            $("toggle-settings").onclick = () => {
                $("settings-box").classList.toggle("hidden");
            };

            function saveHistory() {
                try { localStorage.setItem(HISTORY, JSON.stringify(history.slice(-60))); } catch(e) {}
            }

            function addMessage(role, text, save=true) {
                const chatBox = $("chat");
                if(!chatBox) return;

                const wrapper = document.createElement("div");
                wrapper.className = "message-wrapper " + role;

                const avatar = document.createElement("div");
                avatar.className = "avatar";
                avatar.textContent = role === "user" ? "👤" : "✨";

                const bubble = document.createElement("div");
                bubble.className = "bubble";
                bubble.textContent = text;

                wrapper.appendChild(avatar);
                wrapper.appendChild(bubble);
                chatBox.appendChild(wrapper);
                chatBox.scrollTop = chatBox.scrollHeight;

                if(save) {
                    history.push({role, text});
                    saveHistory();
                }
            }

            history.forEach(m => addMessage(m.role, m.text, false));
            if(history.length === 0) {
                addMessage("bot", "Hello! Main SWARA hoon. 💙 Settings icon (⚙️) par click karke apni API key save karein aur phir baat shuru karein.", false);
            }

            if($("save")) {
                $("save").onclick = () => {
                    try {
                        localStorage.setItem(KEY, $("key").value.trim());
                        localStorage.setItem(MODEL, $("model").value);
                        $("status").textContent = "API Key saved successfully!";
                        $("settings-box").classList.add("hidden");
                        setTimeout(() => { $("status").textContent = "SWARA is ready"; }, 3000);
                    } catch(e) { alert("Storage unavailable."); }
                };
            }

            if($("clear")) {
                $("clear").onclick = () => {
                    if(!confirm("Chat history delete karein?")) return;
                    history = [];
                    saveHistory();
                    if($("chat")) $("chat").replaceChildren();
                    addMessage("bot", "Nayi shuruaat! 💙", false);
                };
            }

            if($("voice")) {
                $("voice").onclick = () => {
                    voiceOn = !voiceOn;
                    $("voice").textContent = voiceOn ? "🔊" : "🔇";
                    if(!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
                };
            }

            function speak(text) {
                if(!voiceOn || !("speechSynthesis" in window)) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = "hi-IN";
                speechSynthesis.speak(u);
            }

            async function sendMessage() {
                const msgInput = $("message");
                if(!msgInput) return;
                const text = msgInput.value.trim();
                if(!text) return;
                
                const apiKey = $("key").value.trim() || localStorage.getItem(KEY);
                const model = $("model").value;

                addMessage("user", text);
                msgInput.value = "";

                if(!apiKey) {
                    addMessage("bot", "Pehle upar Settings (⚙️) button par click karke apni Gemini API key daalo aur save karo.");
                    $("settings-box").classList.remove("hidden");
                    return;
                }

                if($("status")) $("status").textContent = "SWARA is thinking...";

                try {
                    const contents = history.map(h => ({
                        role: h.role === "user" ? "user" : "model",
                        parts: [{ text: h.text }]
                    }));

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents })
                    });

                    const data = await response.json();
                    if($("status")) $("status").textContent = "SWARA is ready";

                    if(data.candidates && data.candidates[0].content) {
                        const reply = data.candidates[0].content.parts[0].text;
                        addMessage("bot", reply);
                        speak(reply);
                    } else {
                        addMessage("bot", "Error: " + (data.error?.message || "Invalid API response"));
                    }
                } catch(err) {
                    if($("status")) $("status").textContent = "Error occurred";
                    addMessage("bot", "Network error occurred.");
                }
            }

            if($("send")) $("send").onclick = sendMessage;
            if($("message")) {
                $("message").onkeydown = (e) => {
                    if(e.key === "Enter") sendMessage();
                };
            }
        });
    </script>
</body>
</html>
