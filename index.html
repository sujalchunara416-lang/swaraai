
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b18">
<title>SWARA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:#eef2ff;font-family:system-ui,Arial,sans-serif}
header{text-align:center;padding:22px;border-bottom:1px solid #26304a}
h1{margin:0;color:#85e9ff;letter-spacing:6px;font-size:32px}
small{color:#a8b2d0}
main{max-width:700px;margin:auto;padding:16px}
.orb{width:110px;height:110px;margin:22px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,white,#71eaff 18%,#6557ff 55%,#14132d 75%);box-shadow:0 0 35px #6557ff88;animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:0 0 60px #71eaff88}}
#status{text-align:center;color:#85e9ff;font-size:13px;margin-bottom:14px}
#chat{height:42vh;min-height:220px;overflow-y:auto;padding:12px;background:#10152a;border:1px solid #27304f;border-radius:16px}
.msg{padding:11px 13px;margin:9px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#26345c;margin-left:12%;text-align:right}
.bot{background:#171f38;margin-right:8%}
.controls{display:flex;gap:8px;margin-top:12px}
input,button,select{font:inherit;border-radius:10px;border:1px solid #303958;padding:12px;background:#151b30;color:white}
input{min-width:0;flex:1}
button{cursor:pointer}
button:disabled{opacity:.5}
.primary{background:#5149d9;border:0}
.settings{display:grid;gap:8px;margin-top:16px}
.settings input,.settings select{width:100%}
.note{font-size:12px;color:#9ca9c8;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>SWARA</h1>
<small>Your Personal AI Companion</small>
</header>
<main>
<div class="orb"></div>
<div id="status">READY TO CONNECT</div>
<div id="chat" aria-live="polite"></div>
<div class="controls">
<input id="message" placeholder="Talk to SWARA..." autocomplete="off">
<button id="send" class="primary">Send</button>
</div>
<div class="controls">
<button id="mic">🎙 Speak</button>
<button id="voice">🔊 Voice ON</button>
<button id="clear">Clear Chat</button>
</div>
<div class="settings">
<label for="key">Gemini API Key</label>
<input id="key" type="password" placeholder="Paste your API key">
<label for="model">AI Model</label>
<select id="model">
<option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
</select>
<button id="save" class="primary">Save Settings</button>
<p class="note">Settings and chat are stored in this browser. Never publish your API key in public code. A secure public app needs a backend to protect it.</p>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const KEY="swara_key_v1";
const MODEL="swara_model_v1";
const HISTORY="swara_history_v1";
let voiceOn=true;
let history=[];
try{history=JSON.parse(localStorage.getItem(HISTORY)||"[]")}catch(e){history=[]}
$("key").value=localStorage.getItem(KEY)||"";
$("model").value=localStorage.getItem(MODEL)||"gemini-2.5-flash";

function saveHistory(){
try{localStorage.setItem(HISTORY,JSON.stringify(history.slice(-60)))}catch(e){}
}
function addMessage(role,text,save=true){
const d=document.createElement("div");
d.className="msg "+(role==="user"?"user":"bot");
d.textContent=text;
$("chat").appendChild(d);
$("chat").scrollTop=$("chat").scrollHeight;
if(save){history.push({role,text});saveHistory()}
}
history.forEach(m=>addMessage(m.role,m.text,false));
if(!history.length)addMessage("bot","Hey! Main SWARA hoon. 💙 Apni API key settings mein save karo aur phir mujhse baat karo.");

$("save").onclick=()=>{
try{
localStorage.setItem(KEY,$("key").value.trim());
localStorage.setItem(MODEL,$("model").value);
$("status").textContent="SETTINGS SAVED";
alert("Settings saved in this browser.");
}catch(e){alert("Browser storage unavailable.")}
};

$("clear").onclick=()=>{
if(!confirm("Delete all chat history?"))return;
history=[];
saveHistory();
$("chat").replaceChildren();
addMessage("bot","Nayi shuruaat! 💙",false);
};

$("voice").onclick=()=>{
voiceOn=!voiceOn;
$("voice").textContent=voiceOn?"🔊 Voice ON":"🔇 Voice OFF";
if(!voiceOn&&"speechSynthesis"in window)speechSynthesis.cancel();
};

function speak(text){
if(!voiceOn||!("speechSynthesis"in window))return;
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
u.lang="hi-IN";
const voices=speechSynthesis.getVoices();
const hindi=voices.find(v=>v.lang.toLowerCase().startsWith("hi"));
if(hindi)u.voice=hindi;
speechSynthesis.speak(u);
}

async function sendMessage(){
const text=$("message").value.trim();
if(!text)return;
const apiKey=$("key").value.trim()||localStorage.getItem(KEY);
const model=$("model").value;
addMessage("user",text);
$("message").value="";
if(!apiKey){
addMessage("bot","Pehle Gemini API key daalo aur Save Settings dabao.");
return;
}
$("send").disabled=true;
$("status").textContent="SWARA IS THINKING...";
try{
const contents=history
.filter(m=>m.role==="user"||m.role==="assistant")
.slice(-20)
.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.text}]}));
const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent",{
method:"POST",
headers:{"Content-Type":"application/json","x-goog-api-key":apiKey},
body:JSON.stringify({
systemInstruction:{parts:[{text:"You are SWARA, a friendly female AI companion. Be warm, natural, supportive and helpful. Speak Hindi or Hinglish when the user does. Never claim to be human."}]},
contents,
generationConfig:{temperature:0.8,maxOutputTokens:700}
})
});
const data=await res.json();
if(!res.ok)throw Error(data.error?.message||"API request failed");
const answer=data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("").trim();
if(!answer)throw Error("Empty AI response");
addMessage("assistant",answer);
speak(answer);
$("status").textContent="SWARA IS ONLINE";
}catch(e){
addMessage("bot","Error: "+e.message+"\nAPI key, model aur internet check karo.");
$("status").textContent="CONNECTION ERROR";
}finally{$("send").disabled=false}
}
$("send").onclick=sendMessage;
$("message").addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

$("mic").onclick=()=>{
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Recognition){alert("Mic recognition support nahi hai. Chrome mein try karo.");return}
const r=new Recognition();
r.lang="hi-IN";
r.interimResults=false;
r.onresult=e=>{$("message").value=e.results[0][0].transcript;sendMessage()};
r.onerror=e=>alert("Mic error: "+e.error);
r.start();
};
</script>
</body>
</html>
