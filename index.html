<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWARA AI</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: Arial, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h2 { text-align: center; color: #58a6ff; margin: 5px 0; }
        #chat { flex: 1; overflow-y: auto; border: 1px solid #30363d; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #161b22; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 6px; max-width: 85%; word-break: break-word; font-size: 14px; }
        .msg.user { background: #1f6feb; color: white; align-self: flex-end; }
        .msg.bot { background: #21262d; color: #c9d1d9; align-self: flex-start; border: 1px solid #30363d; }
        .controls { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        input, select, button { padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: white; font-size: 14px; }
        input { flex: 1; }
        button { background: #238636; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        #status { font-size: 11px; color: #8b949e; text-align: center; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>SWARA AI 💙</h2>
    <div id="status">SWARA IS READY</div>
    <div class="controls">
        <input type="password" id="key" placeholder="Gemini API Key">
        <select id="model">
            <option value="gemini-2.5-flash">2.5 Flash</option>
            <option value="gemini-1.5-flash">1.5 Flash</option>
        </select>
        <button id="save">Save</button>
        <button id="clear">Clear</button>
        <button id="voice">🔊 ON</button>
    </div>
    <div id="chat"></div>
    <div class="controls">
        <input type="text" id="message" placeholder="Type a message...">
        <button id="send">Send</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const $ = id => document.getElementById(id);
            const KEY = "swara_key_v1";
            const MODEL = "swara_model_v1";
            const HISTORY = "swara_history_v1";
            let voiceOn = true;
            let history = [];

            try {
                history = JSON.parse(localStorage.getItem(HISTORY)) || [];
            } catch(e) { history = []; }

            if($("key")) $("key").value = localStorage.getItem(KEY) || "";
            if($("model")) $("model").value = localStorage.getItem(MODEL) || "gemini-2.5-flash";

            function saveHistory() {
                try { localStorage.setItem(HISTORY, JSON.stringify(history.slice(-60))); } catch(e) {}
            }

            function addMessage(role, text, save=true) {
                const chatBox = $("chat");
                if(!chatBox) return;
                const d = document.createElement("div");
                d.className = "msg " + (role === "user" ? "user" : "bot");
                d.textContent = text;
                chatBox.appendChild(d);
                chatBox.scrollTop = chatBox.scrollHeight;
                if(save) {
                    history.push({role, text});
                    saveHistory();
                }
            }

            history.forEach(m => addMessage(m.role, m.text, false));
            if(history.length === 0) {
                addMessage("bot", "Hey! Main SWARA hoon. 💙 Apni API key settings mein save karo aur phir mujhse baat karo.", false);
            }

            if($("save")) {
                $("save").onclick = () => {
                    try {
                        localStorage.setItem(KEY, $("key").value.trim());
                        localStorage.setItem(MODEL, $("model").value);
                        if($("status")) $("status").textContent = "SETTINGS SAVED";
                        alert("Settings saved!");
                    } catch(e) { alert("Storage unavailable."); }
                };
            }

            if($("clear")) {
                $("clear").onclick = () => {
                    if(!confirm("Delete chat history?")) return;
                    history = [];
                    saveHistory();
                    if($("chat")) $("chat").replaceChildren();
                    addMessage("bot", "Nayi shuruaat! 💙", false);
                };
            }

            if($("voice")) {
                $("voice").onclick = () => {
                    voiceOn = !voiceOn;
                    $("voice").textContent = voiceOn ? "🔊 ON" : "🔇 OFF";
                    if(!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
                };
            }

            function speak(text) {
                if(!voiceOn || !("speechSynthesis" in window)) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = "hi-IN";
                speechSynthesis.speak(u);
            }

            async function sendMessage() {
                const msgInput = $("message");
                if(!msgInput) return;
                const text = msgInput.value.trim();
                if(!text) return;
                
                const apiKey = $("key").value.trim() || localStorage.getItem(KEY);
                const model = $("model").value;

                addMessage("user", text);
                msgInput.value = "";

                if(!apiKey) {
                    addMessage("bot", "Pehle Gemini API key daalo aur Save dabao.");
                    return;
                }

                if($("send")) $("send").disabled = true;
                if($("status")) $("status").textContent = "SWARA IS THINKING...";

                try {
                    const contents = history.map(h => ({
                        role: h.role === "user" ? "user" : "model",
                        parts: [{ text: h.text }]
                    }));

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents })
                    });

                    const data = await response.json();
                    if($("send")) $("send").disabled = false;
                    if($("status")) $("status").textContent = "SWARA IS READY";

                    if(data.candidates && data.candidates[0].content) {
                        const reply = data.candidates[0].content.parts[0].text;
                        addMessage("bot", reply);
                        speak(reply);
                    } else {
                        addMessage("bot", "Error: " + (data.error?.message || "Invalid API response"));
                    }
                } catch(err) {
                    if($("send")) $("send").disabled = false;
                    if($("status")) $("status").textContent = "ERROR";
                    addMessage("bot", "Network error occurred.");
                }
            }

            if($("send")) $("send").onclick = sendMessage;
            if($("message")) {
                $("message").onkeydown = (e) => {
                    if(e.key === "Enter") sendMessage();
                };
            }
        });
    </script>
</body>
</html>
