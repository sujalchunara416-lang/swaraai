<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>SWARA AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #090914;
  --panel: #111122;
  --card: #19192e;
  --purple: #9b5cff;
  --cyan: #00e5ff;
  --text: #f4f2ff;
  --muted: #9290aa;
  --border: rgba(255,255,255,.09);
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  height: 100dvh;
  display: flex;
  overflow: hidden;
  background:
    radial-gradient(circle at 75% 10%,
    rgba(112,55,190,.13), transparent 35%),
    var(--bg);
}

.sidebar {
  width: 270px;
  background: rgba(15,15,30,.97);
  border-right: 1px solid var(--border);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  transition: .3s;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: bold;
  background: linear-gradient(135deg,
    #713cff, #00d9ff);
  box-shadow: 0 0 22px #813cff55;
}

.brand-name {
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 2px;
}

.brand-sub {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 3px;
}

.new-chat {
  border: 1px solid #8954ff66;
  border-radius: 12px;
  padding: 13px;
  color: white;
  background: linear-gradient(110deg,
    #713cff33, #00d9ff12);
  text-align: left;
}

.new-chat:hover {
  border-color: var(--cyan);
}

.side-label {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 2px;
  padding: 5px;
}

.history {
  flex: 1;
  overflow-y: auto;
}

.history-item {
  padding: 11px;
  margin-bottom: 5px;
  border-radius: 9px;
  color: #c7c4dc;
  font-size: 13px;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.history-item:hover,
.history-item.active {
  background: #25213b;
  color: white;
}

.profile {
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,
    #743dff, #00cfff);
}

.profile small {
  color: var(--muted);
  font-size: 11px;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 65px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.top-left, .top-right {
  display: flex;
  align-items: center;
  gap: 13px;
}

.menu-btn, .icon-btn {
  border: 0;
  color: white;
  background: transparent;
  font-size: 21px;
  padding: 7px;
}

.model-name {
  font-size: 13px;
  color: #d9d3f4;
}

.status {
  font-size: 11px;
  color: #57e9bd;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 25px 15px 20px;
  scroll-behavior: smooth;
}

.chat-content {
  max-width: 850px;
  margin: auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.welcome {
  margin: auto;
  text-align: center;
  padding: 35px 10px;
}

.welcome-logo {
  width: 76px;
  height: 76px;
  margin: 0 auto 22px;
  border-radius: 25px;
  display: grid;
  place-items: center;
  font-size: 38px;
  background: linear-gradient(135deg,
    #783cff, #00d9ff);
  box-shadow: 0 0 45px #773cff55;
}

.welcome h1 {
  font-size: clamp(27px, 5vw, 39px);
  margin-bottom: 12px;
  background: linear-gradient(90deg,
    #bd91ff, #00e5ff);
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}
 .messages {
  display: flex;
  flex-direction: column;
  gap: 25px;
  padding: 15px 0 30px;
}

.message {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  animation: appear .25s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: #25203e;
}

.message.user .msg-avatar {
  background: linear-gradient(135deg,#713cff,#00bfe8);
}

.msg-body {
  flex: 1;
  min-width: 0;
  line-height: 1.75;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.msg-name {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
  color: #c5a3ff;
}

.message.user .msg-name {
  color: #55dff5;
}

.msg-text {
  white-space: pre-wrap;
}

.msg-actions {
  display: flex;
  gap: 12px;
  margin-top: 9px;
}

.msg-actions button {
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 12px;
}

.msg-actions button:hover {
  color: var(--cyan);
}

.composer-wrap {
  padding: 12px 15px 18px;
  background: linear-gradient(transparent,var(--bg) 25%);
}

.composer {
  max-width: 850px;
  margin: auto;
  border: 1px solid #8c5bff66;
  background: #171629;
  border-radius: 19px;
  padding: 12px;
  box-shadow: 0 0 25px #7540ff12;
}

.composer textarea {
  display: block;
  width: 100%;
  min-height: 45px;
  max-height: 150px;
  resize: none;
  outline: none;
  border: 0;
  color: white;
  background: transparent;
  padding: 9px;
  font-size: 14px;
}

.composer textarea::placeholder {
  color: #77758f;
}

.composer-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px;
}

.tool-left {
  display: flex;
  gap: 7px;
}

.tool-btn {
  border: 0;
  background: transparent;
  color: #aaa6c2;
  padding: 8px;
  border-radius: 9px;
  font-size: 17px;
}

.tool-btn:hover {
  background: #29233e;
  color: var(--cyan);
}

.send-btn {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 12px;
  color: white;
  font-size: 18px;
  background: linear-gradient(135deg,#7841ff,#00bfe8);
}

.send-btn:disabled {
  opacity: .4;
}

.disclaimer {
  text-align: center;
  color: #77758c;
  font-size: 10px;
  margin-top: 10px;
}

.typing {
  color: var(--cyan);
  font-size: 13px;
  padding: 10px 0;
}

.typing span {
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: .2; }
}

.code-box {
  background: #080812;
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 10px;
  overflow-x: auto;
  margin: 10px 0;
}

.code-box pre {
  white-space: pre;
  font-size: 12px;
  color: #9de9ff;
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 8;
}

.overlay.show {
  display: block;
}

.settings-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #000a;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.settings-panel.show {
  display: flex;
}

.settings-card {
  width: 100%;
  max-width: 420px;
  background: #171629;
  border: 1px solid #8855ff66;
  border-radius: 18px;
  padding: 22px;
}

.settings-card h2 {
  margin-bottom: 18px;
}

.settings-card label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin: 13px 0 7px;
}

.settings-card input,
.settings-card select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  outline: none;
  color: white;
  background: #0c0c19;
}

.settings-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.settings-actions button {
  flex: 1;
  padding: 11px;
  border-radius: 9px;
  border: 0;
  color: white;
  background: #7541e8;
}

.settings-actions .cancel {
  background: #343348;
}

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    transform: translateX(-100%);
    width: 280px;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .topbar {
    height: 58px;
    padding: 0 12px;
  }

  .chat-area {
    padding: 15px 12px;
  }

  .composer-wrap {
    padding: 8px 10px 12px;
  }

  .welcome {
    padding: 20px 5px;
  }

  .message {
    gap: 9px;
  }
}
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">S</div>
      <div>
        <div class="brand-name">SWARA AI</div>
        <div class="brand-sub">YOUR AI COMPANION</div>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      ＋ &nbsp; New Chat
    </button>

    <div class="side-label">RECENT CHATS</div>
    <div class="history" id="history"></div>

    <div class="profile">
      <div class="avatar">S</div>
      <div>
        <div>SWARA USER</div>
        <small>Personal Assistant</small>
      </div>
      <button class="icon-btn" id="settingsBtn"
        title="Settings">⚙</button>
    </div>

  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">

    <header class="topbar">
      <div class="top-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <span class="model-name">SWARA AI 2.0</span>
      </div>

      <div class="top-right">
        <span class="status">● Online</span>
        <button class="icon-btn" id="clearBtn"
          title="Clear chat">＋</button>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="chat-content" id="chatContent">

        <div class="welcome" id="welcome">
          <div class="welcome-logo">✦</div>
          <h1>Hello, I'm SWARA.</h1>
          <p>
            Your personal AI companion.<br>
            Ask me anything. Let's explore together.
          </p>
        </div>

        <div class="messages" id="messages"></div>

      </div>
    </section>

    <footer class="composer-wrap">

      <div class="composer">

        <textarea id="userInput"
          placeholder="Message SWARA..."
          rows="1"></textarea>

        <div class="composer-tools">

          <div class="tool-left">

            <button class="tool-btn" id="voiceBtn"
              title="Voice input">🎙</button>

            <button class="tool-btn" id="attachBtn"
              title="Attach file">📎</button>

            <input type="file" id="fileInput"
              hidden accept="image/*,.txt,.pdf">

            <button class="tool-btn" id="readBtn"
              title="Read aloud">🔊</button>

          </div>

          <button class="send-btn" id="sendBtn"
            title="Send message">➤</button>

        </div>

      </div>

      <div class="disclaimer">
        SWARA AI can make mistakes. Verify important information.
      </div>

    </footer>

  </main>

</div>

<!-- SETTINGS -->

<div class="settings-panel" id="settingsPanel">
  <div class="settings-card">

    <h2>⚙ SWARA Settings</h2>

    <label>Groq API Key</label>
    <input type="password" id="apiKey"
      placeholder="Paste your Groq API key">

    <label>AI Model</label>
    <select id="modelSelect">
      <option value="openai/gpt-oss-20b">
        GPT OSS 20B
      </option>
      <option value="openai/gpt-oss-120b">
        GPT OSS 120B
      </option>
    </select>

    <div class="settings-actions">
      <button id="saveSettings">Save</button>
      <button class="cancel" id="closeSettings">
        Cancel
      </button>
    </div>

  </div>
</div>
<script>

const API_URL =
  "https://api.groq.com/openai/v1/chat/completions";

const DEFAULT_MODEL = "openai/gpt-oss-20b";

const SYSTEM_PROMPT = `
You are SWARA, a friendly, intelligent and helpful AI companion.
Your personality is warm, natural and conversational.
You can communicate in Hindi, Hinglish, Gujarati and English.
Understand the user's language and reply in the same language.
Give accurate, clear and useful answers.
Explain complicated topics in simple steps.
Never pretend to know something you do not know.
Be respectful, supportive and honest.
`;

const $ = id => document.getElementById(id);

let conversations = {};
let activeId = null;
let isGenerating = false;
let uploadedFile = null;
let lastReply = "";

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2,7);
}

function saveData() {
  try {
    localStorage.setItem(
      "swara_conversations",
      JSON.stringify(conversations)
    );
    localStorage.setItem("swara_active", activeId || "");
  } catch(e) {
    console.error("Memory save failed", e);
  }
}

function loadData() {
  try {
    conversations = JSON.parse(
      localStorage.getItem("swara_conversations") || "{}"
    );
    activeId = localStorage.getItem("swara_active");

    if (!conversations || typeof conversations !== "object")
      conversations = {};

    if (!activeId || !conversations[activeId])
      activeId = null;

  } catch(e) {
    conversations = {};
    activeId = null;
  }
}

function createChat() {
  const id = makeId();

  conversations[id] = {
    id,
    title: "New conversation",
    messages: [],
    updated: Date.now()
  };

  activeId = id;
  saveData();
  renderAll();

  $("userInput").focus();
}

function currentChat() {
  if (!activeId || !conversations[activeId])
    createChat();

  return conversations[activeId];
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function formatText(value) {
  let html = escapeHTML(value);

  html = html.replace(
    /```(?:[a-zA-Z0-9_-]+)?\n?([\s\S]*?)```/g,
    '<div class="code-box"><pre>$1</pre></div>'
  );

  html = html.replace(
    /`([^`]+)`/g,
    '<code>$1</code>'
  );

  html = html.replace(
    /\*\*(.*?)\*\*/g,
    '<strong>$1</strong>'
  );

  return html;
}

function addMessage(role, content) {
  const chat = currentChat();

  const msg = {
    id: makeId(),
    role,
    content,
    time: Date.now()
  };

  chat.messages.push(msg);
  chat.updated = Date.now();

  if (role === "user" &&
      chat.title === "New conversation") {
    chat.title = content.slice(0, 35) || "New conversation";
  }

  saveData();
  renderAll();

  return msg.id;
}

function renderMessages() {
  const chat = currentChat();
  const container = $("messages");

  $("welcome").style.display =
    chat.messages.length ? "none" : "block";

  container.innerHTML = chat.messages.map(msg => {
    const isUser = msg.role === "user";

    return `
      <div class="message ${isUser ? "user" : "assistant"}"
        data-id="${msg.id}">

        <div class="msg-avatar">
          ${isUser ? "👤" : "✦"}
        </div>

        <div class="msg-body">
          <div class="msg-name">
            ${isUser ? "You" : "SWARA"}
          </div>

          <div class="msg-text">
            ${formatText(msg.content)}
          </div>

          <div class="msg-actions">
            <button data-action="copy"
              data-id="${msg.id}">Copy</button>

            ${!isUser ? `
              <button data-action="speak"
                data-id="${msg.id}">Read aloud</button>
              <button data-action="retry"
                data-id="${msg.id}">Regenerate</button>
            ` : ""}
          </div>
        </div>

      </div>
    `;
  }).join("");

  $("chatArea").scrollTop = $("chatArea").scrollHeight;
}

function renderHistory() {
  const history = $("history");

  const sorted = Object.values(conversations)
    .sort((a,b) => b.updated - a.updated);

  history.innerHTML = sorted.map(chat => `
    <div class="history-item
      ${chat.id === activeId ? "active" : ""}"
      data-chat="${chat.id}">
      ${escapeHTML(chat.title)}
    </div>
  `).join("");
}

function renderAll() {
  renderHistory();
  renderMessages();
}

function switchChat(id) {
  if (!conversations[id]) return;

  activeId = id;
  saveData();
  renderAll();

  if (window.innerWidth <= 700)
    closeSidebar();
}

loadData();

if (activeId && conversations[activeId]) {
  renderAll();
} else {
  createChat();
}
 let abortController = null;

function getApiKey() {
  return localStorage.getItem("swara_api_key") || "";
}

async function requestAI() {
  const key = getApiKey();

  if (!key) {
    $("settingsPanel").classList.add("show");
    $("apiKey").focus();
    return;
  }

  const chat = currentChat();

  if (!chat.messages.length) return;

  isGenerating = true;
  abortController = new AbortController();

  $("sendBtn").textContent = "■";
  $("sendBtn").title = "Stop generating";

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typing";
  typing.innerHTML = "SWARA is thinking <span>●</span>";
  $("messages").appendChild(typing);

  $("chatArea").scrollTop = $("chatArea").scrollHeight;

  try {
    const selectedModel =
      $("modelSelect").value || DEFAULT_MODEL;

    const messages = [
      {
        role: "system",
        content: SYSTEM_PROMPT
      },
      ...chat.messages.slice(-30).map(m => ({
        role: m.role,
        content: m.content
      }))
    ];

    const response = await fetch(API_URL, {
      method: "POST",
      signal: abortController.signal,

      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + key
      },

      body: JSON.stringify({
        model: selectedModel,
        messages: messages,
        temperature: 0.7,
        max_completion_tokens: 2048,
        stream: false
      })
    });

    const data = await response.json();

    if (!response.ok) {
      const message =
        data.error?.message || "Unknown API error";

      if (response.status === 401) {
        throw new Error("Invalid API key. Check Settings.");
      }

      if (response.status === 429) {
        throw new Error(
          "Free-tier limit reached. Please wait and try again."
        );
      }

      throw new Error(message);
    }

    const reply =
      data.choices?.[0]?.message?.content;

    if (!reply) throw new Error("Empty AI response.");

    lastReply = reply;
    addMessage("assistant", reply);

  } catch(error) {

    if (error.name === "AbortError") {
      // Generation stopped by user.
    } else {
      addMessage(
        "assistant",
        "⚠ " + error.message
      );
    }

  } finally {
    isGenerating = false;
    abortController = null;

    const loader = $("typing");
    if (loader) loader.remove();

    $("sendBtn").textContent = "➤";
    $("sendBtn").title = "Send message";
  }
}

async function sendMessage() {
  if (isGenerating) {
    abortController?.abort();
    return;
  }

  const input = $("userInput");
  const text = input.value.trim();

  if (!text && !uploadedFile) return;

  let finalText = text;

  if (uploadedFile) {
    finalText += "\n\n[Attached file: " +
      uploadedFile.name + "]";

    if (uploadedFile.content) {
      finalText += "\n" + uploadedFile.content;
    }

    uploadedFile = null;
  }

  input.value = "";
  input.style.height = "auto";

  addMessage("user", finalText);

  await requestAI();
}

async function regenerate() {
  if (isGenerating) return;

  const chat = currentChat();

  if (!chat.messages.length) return;

  if (chat.messages[chat.messages.length - 1].role
      === "assistant") {
    chat.messages.pop();
  }

  saveData();
  renderAll();

  await requestAI();
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}
 // SETTINGS

$("settingsBtn").onclick = () => {
  $("apiKey").value = getApiKey();
  $("modelSelect").value =
    localStorage.getItem("swara_model") || DEFAULT_MODEL;

  $("settingsPanel").classList.add("show");
};

$("closeSettings").onclick = () => {
  $("settingsPanel").classList.remove("show");
};

$("saveSettings").onclick = async () => {
  const key = $("apiKey").value.trim();

  if (key) {
    localStorage.setItem("swara_api_key", key);
  }

  localStorage.setItem(
    "swara_model",
    $("modelSelect").value
  );

  $("settingsPanel").classList.remove("show");

  const chat = currentChat();

  if (
    chat.messages.length &&
    chat.messages[chat.messages.length - 1].role === "user"
  ) {
    await requestAI();
  }
};

// CHAT CONTROLS

$("newChat").onclick = createChat;
$("clearBtn").onclick = createChat;
$("sendBtn").onclick = sendMessage;

$("userInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

$("userInput").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height =
    Math.min(e.target.scrollHeight, 150) + "px";
});

// HISTORY

$("history").addEventListener("click", e => {
  const item = e.target.closest("[data-chat]");
  if (item) switchChat(item.dataset.chat);
});

// MESSAGE ACTIONS

$("messages").addEventListener("click", async e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;

  const id = btn.dataset.id;
  const action = btn.dataset.action;

  const chat = currentChat();
  const msg = chat.messages.find(m => m.id === id);

  if (!msg) return;

  if (action === "copy") {
    try {
      await navigator.clipboard.writeText(msg.content);
      btn.textContent = "Copied!";
    } catch {
      btn.textContent = "Copy unavailable";
    }
  }

  if (action === "speak") {
    stopSpeaking();

    if ("speechSynthesis" in window) {
      const utterance =
        new SpeechSynthesisUtterance(msg.content);

      utterance.lang = "hi-IN";
      speechSynthesis.speak(utterance);
    }
  }

  if (action === "retry") {
    await regenerate();
  }
});

// SIDEBAR

function closeSidebar() {
  $("sidebar").classList.remove("open");
  $("overlay").classList.remove("show");
}

$("menuBtn").onclick = () => {
  $("sidebar").classList.toggle("open");
  $("overlay").classList.toggle("show");
};

$("overlay").onclick = closeSidebar;

// VOICE INPUT

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  $("voiceBtn").onclick = () => {
    try {
      recognition.start();
      $("voiceBtn").textContent = "🔴";
    } catch(e) {
      console.log(e);
    }
  };

  recognition.onresult = event => {
    const transcript =
      event.results[0][0].transcript;

    $("userInput").value += transcript;
    $("userInput").focus();
  };

  recognition.onend = () => {
    $("voiceBtn").textContent = "🎙";
  };

  recognition.onerror = () => {
    $("voiceBtn").textContent = "🎙";
  };

} else {
  $("voiceBtn").onclick = () => {
    alert("Voice input is not supported in this browser.");
  };
}

// FILE ATTACHMENT

$("fileInput").accept = ".txt,.md,.csv";

$("attachBtn").onclick = () => {
  $("fileInput").click();
};

$("fileInput").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;

  if (file.size > 500000) {
    alert("File must be smaller than 500 KB.");
    e.target.value = "";
    return;
  }

  if (!/\.(txt|md|csv)$/i.test(file.name)) {
    alert("Currently supported: TXT, MD and CSV files.");
    e.target.value = "";
    return;
  }

  const content = await file.text();

  uploadedFile = {
    name: file.name,
    content: content
  };

  $("userInput").placeholder =
    "Attached: " + file.name + " — Ask SWARA...";

  e.target.value = "";
};

// READ LAST RESPONSE

$("readBtn").onclick = () => {
  const chat = currentChat();

  const last = [...chat.messages]
    .reverse()
    .find(m => m.role === "assistant");

  if (!last) return;

  stopSpeaking();

  if ("speechSynthesis" in window) {
    const speech =
      new SpeechSynthesisUtterance(last.content);

    speech.lang = "hi-IN";
    speechSynthesis.speak(speech);
  }
};

// LOAD SAVED SETTINGS

if (localStorage.getItem("swara_model")) {
  $("modelSelect").value =
    localStorage.getItem("swara_model");
}

console.log("SWARA AI 2.0 READY");

</script>

</body>
</html>
