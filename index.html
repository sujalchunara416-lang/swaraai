<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SWARA AI - Advanced Assistant</title>
    <!-- Professional App Icon & PWA Meta Tags for Shortcut -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2230%22 fill=%22%233b82f6%22/><text y=%2254%%22 x=%2250%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2255%22 fill=%22white%22 font-family=%22Segoe UI, sans-serif%22 font-weight=%22bold%22>S</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2230%22 fill=%22%233b82f6%22/><text y=%2254%%22 x=%2250%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2255%22 fill=%22white%22 font-family=%22Segoe UI, sans-serif%22 font-weight=%22bold%22>S</text></svg>">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090d16">

    <style>
        :root {
            --bg-deep: #090d16;
            --bg-panel: #111827;
            --bg-card: #1f2937;
            --border-subtle: #374151;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --user-bubble: #2563eb;
            --bot-bubble: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            height: 100vh; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* Top Header */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 16px; 
            background: var(--bg-panel); 
            border-bottom: 1px solid var(--border-subtle); 
            z-index: 10;
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .logo-box { 
            width: 32px; 
            height: 32px; 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
            font-size: 16px; 
            color: white; 
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); 
        }
        .brand-title { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }

        .toolbar { display: flex; gap: 6px; align-items: center; }
        
        button, select, input { 
            background: var(--bg-card); 
            border: 1px solid var(--border-subtle); 
            color: var(--text-main); 
            padding: 6px 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            outline: none; 
            transition: all 0.2s ease; 
        }
        button { background: var(--accent); border: none; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--accent-hover); }
        select { cursor: pointer; }

        /* Settings Dropdown Drawer */
        .settings-drawer { 
            background: var(--bg-panel); 
            padding: 10px 16px; 
            border-bottom: 1px solid var(--border-subtle); 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            max-height: 60px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .settings-drawer.hidden { max-height: 0; padding: 0 16px; border: none; }
        .settings-drawer input { flex: 1; padding: 7px 10px; font-size: 13px; }

        /* Status notification */
        .status-strip { font-size: 10px; color: var(--text-muted); text-align: center; padding: 3px; background: #06090f; letter-spacing: 0.5px; }

        /* Chat Stream Area */
        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            scroll-behavior: smooth; 
        }

        .message-row { display: flex; gap: 10px; max-width: 90%; animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.bot { align-self: flex-start; }

        .msg-avatar { 
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 13px; 
            flex-shrink: 0; 
        }
        .user .msg-avatar { background: var(--accent); color: white; }
        .bot .msg-avatar { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; box-shadow: 0 0 8px rgba(139, 92, 246, 0.3); }

        .msg-bubble { 
            padding: 10px 14px; 
            border-radius: 12px; 
            font-size: 13.5px; 
            line-height: 1.5; 
            word-break: break-word; 
            white-space: pre-wrap;
        }
        .user .msg-bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 3px; }
        .bot .msg-bubble { background: var(--bot-bubble); color: var(--text-main); border: 1px solid var(--border-subtle); border-bottom-left-radius: 3px; }

        /* Typing indicator dots */
        .typing-dots { display: flex; gap: 4px; padding: 4px 8px; align-items: center; }
        .typing-dots span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        /* Input Footer */
        .input-footer { 
            padding: 12px 16px; 
            background: var(--bg-panel); 
            border-top: 1px solid var(--border-subtle); 
        }
        .input-wrapper { 
            display: flex; 
            background: var(--bg-deep); 
            border: 1px solid var(--border-subtle); 
            border-radius: 10px; 
            padding: 6px 8px 6px 12px; 
            gap: 8px; 
            align-items: center; 
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15); }
        
        .input-wrapper input { 
            flex: 1; 
            border: none; 
            background: transparent; 
            padding: 4px 0; 
            font-size: 14px; 
            color: var(--text-main); 
        }
        .input-wrapper input:focus { outline: none; }

        .send-btn { 
            width: 34px; 
            height: 34px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: var(--accent); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-size: 14px; 
            transition: transform 0.1s; 
        }
        .send-btn:active { transform: scale(0.92); }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="logo-box">S</div>
            <div class="brand-title">SWARA AI</div>
        </div>
        <div class="toolbar">
            <select id="model">
                <option value="gemini-3.8-flash">3.8 Flash</option>
                <option value="gemini-1.5-flash">1.5 Flash</option>
            </select>
            <button id="toggle-settings" title="Settings">⚙️</button>
            <button id="clear" title="Clear Chat">🗑️</button>
            <button id="voice" title="Voice Toggle">🔊</button>
        </div>
    </header>

    <div class="settings-drawer hidden" id="settings-drawer">
        <input type="password" id="key" placeholder="Enter Gemini API Key...">
        <button id="save">Save</button>
    </div>

    <div class="status-strip" id="status">READY</div>

    <div id="chat"></div>

    <div class="input-footer">
        <div class="input-wrapper">
            <input type="text" id="message" placeholder="Ask SWARA anything...">
            <button class="send-btn" id="send">➤</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const $ = id => document.getElementById(id);
            const KEY = "swara_key_v1";
            const MODEL = "swara_model_v1";
            const HISTORY = "swara_history_v1";
            let voiceOn = true;
            let history = [];

            try {
                history = JSON.parse(localStorage.getItem(HISTORY)) || [];
            } catch(e) { history = []; }

            if($("key")) $("key").value = localStorage.getItem(KEY) || "";
            if($("model")) $("model").value = localStorage.getItem(MODEL) || "gemini-3.8-flash";

            $("toggle-settings").onclick = () => {
                $("settings-drawer").classList.toggle("hidden");
            };

            function saveHistory() {
                try { localStorage.setItem(HISTORY, JSON.stringify(history.slice(-50))); } catch(e) {}
            }

            function addMessage(role, text, save=true) {
                const chatBox = $("chat");
                if(!chatBox) return;

                const row = document.createElement("div");
                row.className = "message-row " + role;

                const avatar = document.createElement("div");
                avatar.className = "msg-avatar";
                avatar.textContent = role === "user" ? "👤" : "✨";

                const bubble = document.createElement("div");
                bubble.className = "msg-bubble";
                bubble.textContent = text;

                row.appendChild(avatar);
                row.appendChild(bubble);
                chatBox.appendChild(row);
                chatBox.scrollTop = chatBox.scrollHeight;

                if(save) {
                    history.push({role, text});
                    saveHistory();
                }
                return bubble;
            }

            function showTyping() {
                const chatBox = $("chat");
                const row = document.createElement("div");
                row.className = "message-row bot";
                row.id = "typing-indicator";
                
                const avatar = document.createElement("div");
                avatar.className = "msg-avatar";
                avatar.textContent = "✨";

                const bubble = document.createElement("div");
                bubble.className = "msg-bubble";
                bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

                row.appendChild(avatar);
                row.appendChild(bubble);
                chatBox.appendChild(row);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function hideTyping() {
                const t = $("typing-indicator");
                if(t) t.remove();
            }

            history.forEach(m => addMessage(m.role, m.text, false));
            if(history.length === 0) {
                addMessage("bot", "Hello! Main SWARA hoon. 💙 Upar settings (⚙️) se apni API key save karein aur professional chat shuru karein.", false);
            }

            $("save").onclick = () => {
                try {
                    localStorage.setItem(KEY, $("key").value.trim());
                    localStorage.setItem(MODEL, $("model").value);
                    $("status").textContent = "SAVED";
                    $("settings-drawer").classList.add("hidden");
                    setTimeout(() => { $("status").textContent = "READY"; }, 2000);
                } catch(e) { alert("Storage error."); }
            };

            $("clear").onclick = () => {
                if(!confirm("Clear chat?")) return;
                history = [];
                saveHistory();
                if($("chat")) $("chat").replaceChildren();
                addMessage("bot", "Nayi shuruaat! 💙", false);
            };

            $("voice").onclick = () => {
                voiceOn = !voiceOn;
                $("voice").textContent = voiceOn ? "🔊" : "🔇";
                if(!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
            };

            function speak(text) {
                if(!voiceOn || !("speechSynthesis" in window)) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = "hi-IN";
                speechSynthesis.speak(u);
            }

            async function sendMessage() {
                const msgInput = $("message");
                if(!msgInput) return;
                const text = msgInput.value.trim();
                if(!text) return;
                
                const apiKey = $("key").value.trim() || localStorage.getItem(KEY);
                const model = $("model").value;

                addMessage("user", text);
                msgInput.value = "";

                if(!apiKey) {
                    addMessage("bot", "Pehle Settings (⚙️) mein apni Gemini API Key daal kar save karein.");
                    $("settings-drawer").classList.remove("hidden");
                    return;
                }

                $("status").textContent = "THINKING...";
                showTyping();

                try {
                    const contents = history.slice(0, -1).map(h => ({
                        role: h.role === "user" ? "user" : "model",
                        parts: [{ text: h.text }]
                    }));
                    contents.push({ role: "user", parts: [{ text: text }] });

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents })
                    });

                    const data = await response.json();
                    hideTyping();
                    $("status").textContent = "READY";

                    if(data.candidates && data.candidates[0].content) {
                        const reply = data.candidates[0].content.parts[0].text;
                        addMessage("bot", reply);
                        speak(reply);
                    } else {
                        addMessage("bot", "Error: " + (data.error?.message || "Invalid API response"));
                    }
                } catch(err) {
                    hideTyping();
                    $("status").textContent = "ERROR";
                    addMessage("bot", "Network error occurred.");
                }
            }

            $("send").onclick = sendMessage;
            $("message").onkeydown = (e) => {
                if(e.key === "Enter") sendMessage();
            };
        });
    </script>
</body>
</html>
